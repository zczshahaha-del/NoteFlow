name: Core regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: noteflow_test
          POSTGRES_USER: noteflow
          POSTGRES_PASSWORD: noteflow_test_password
        options: >-
          --health-cmd "pg_isready -U noteflow -d noteflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: noteflow
      DB_PASSWORD: noteflow_test_password
      DB_NAME: noteflow_test
      NOTEFLOW_RUN_DB_TESTS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: server/requirements-test.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install -r server/requirements-test.txt
      - run: python scripts/quality_gate.py --profile core
      - name: Verify the background index against PostgreSQL
        env:
          PYTHONPATH: server
          NOTEFLOW_RUN_DB_TESTS: 1
        run: |
          python -m alembic -c server/alembic.ini upgrade head
          python -m unittest server.tests.test_database_integration.DatabaseIntegrationTest.test_background_index_releases_connection_and_fences_stale_results
