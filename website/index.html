<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="用自然语言在知流创建笔记。先生成大纲，再写正文。可以预览整篇修改、改写选中文字，并在后续对话参考长期记忆。">
  <meta name="theme-color" content="#f5f7fa">
  <meta property="og:title" content="知流 NoteFlow｜说一句话，写成一篇笔记">
  <meta property="og:description" content="生成笔记，梳理大纲，修改全文或选中的一段。让知流记住你的写作偏好。">
  <meta property="og:type" content="website">
  <title>知流 NoteFlow｜说一句话，写成一篇笔记</title>
  <link rel="icon" href="./assets/zhiliu.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./film.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#top" aria-label="知流 NoteFlow 首页">知流<span>.</span></a>
      <nav aria-label="主导航">
        <a href="#create">生成笔记</a>
        <a href="#outline">大纲</a>
        <a href="#edit">AI 修改</a>
        <a href="#memory">长期记忆</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="workspace" aria-labelledby="hero-title">
      <div class="shell">
        <h1 id="hero-title">说一句话，<span>写成一篇笔记。</span></h1>
        <figure class="product-film" id="create">
          <div class="screen film-screen">
            <video id="product-film" controls playsinline preload="none" poster="./assets/film-poster.webp"
              width="3840" height="2160" aria-label="知流 4K 操作实录，从一句话到一篇笔记" aria-describedby="film-caption">
              <source src="./assets/create-note-4k.mp4" type="video/mp4">
              <a href="./assets/create-note-4k.mp4">打开知流 4K 操作录屏</a>
            </video>
            <button class="film-play" type="button" aria-label="播放操作录屏" aria-controls="product-film" hidden></button>
          </div>
          <figcaption class="film-meta">
            <span id="film-caption">4K · 27 秒</span>
            <details class="film-transcript">
              <summary>文字版</summary>
              <ol>
                <li>请知流写一篇给初学者的 Docker 端口映射笔记。</li>
                <li>点击「生成大纲」，打开草稿查看章节。</li>
                <li>点击「全部生成」，查看逐章生成的正文。</li>
                <li>点击「保存为笔记」，确认后在知识库打开。</li>
              </ol>
            </details>
          </figcaption>
        </figure>
      </div>
    </section>

    <section class="feature outline-feature" id="outline" aria-labelledby="outline-title">
      <div class="shell visual-section">
        <h2 id="outline-title">章节目录</h2>
        <a class="screen" href="./assets/outline.webp" aria-label="放大笔记章节目录的界面截图">
          <img src="./assets/outline.webp" width="1550" height="1089" alt="知流编辑器展开了右侧章节目录，点击章节可以跳到正文对应位置。" loading="lazy">
        </a>
      </div>
    </section>

    <section class="feature edit-section" id="edit" aria-labelledby="edit-title">
      <div class="shell visual-section">
        <h2 id="edit-title">AI 修改</h2>
        <div class="gallery edit-gallery">
          <figure>
            <figcaption>整篇修改</figcaption>
            <a class="screen" href="./assets/edit.webp" aria-label="放大整篇修改的原文对照截图">
              <img src="./assets/edit.webp" width="1920" height="947" alt="知流修改预览左边显示原文，右边显示修改稿，确认后可应用到笔记。" loading="lazy">
            </a>
          </figure>
          <figure>
            <figcaption>AI 改一下</figcaption>
            <a class="screen" href="./assets/selection.webp" aria-label="放大 AI 改一下的选区改写截图">
              <img src="./assets/selection.webp" width="1431" height="873" alt="知流编辑器内的 AI 改一下弹窗，显示选区的改写结果和替换按钮。" loading="lazy">
            </a>
          </figure>
        </div>
      </div>
    </section>

    <section class="feature memory-feature" id="memory" aria-labelledby="memory-title">
      <div class="shell visual-section">
        <h2 id="memory-title">长期记忆</h2>
        <div class="gallery">
          <figure>
            <figcaption>记忆摘要</figcaption>
            <a class="screen" href="./assets/memory.webp" aria-label="放大记忆摘要的界面截图">
              <img src="./assets/memory.webp" width="1424" height="592" alt="知流的记忆摘要显示保存的技术笔记写作偏好。" loading="lazy">
            </a>
          </figure>
          <figure>
            <figcaption>新对话</figcaption>
            <a class="screen" href="./assets/recall.webp" aria-label="放大使用长期记忆的对话截图">
              <img src="./assets/recall.webp" width="900" height="639" alt="知流在新对话中从长期记忆找回写作偏好，先给可运行示例，命令用 Bash。" loading="lazy">
            </a>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <a class="brand" href="#top" aria-label="知流 NoteFlow 首页">知流<span>.</span></a>
      <nav aria-label="相关链接">
        <a href="https://github.com/zczshahaha-del/NoteFlow">项目仓库</a>
        <a href="https://chengspace.cn/">张成的个人空间</a>
      </nav>
    </div>
  </footer>
</body>
</html>
