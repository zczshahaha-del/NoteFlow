<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="知流 NoteFlow 是你的个人知识库。写笔记、搜正文，也能在笔记旁问 AI。">
  <meta name="theme-color" content="#f5f7fa">
  <meta property="og:title" content="知流 NoteFlow｜个人知识库">
  <meta property="og:description" content="写笔记、搜正文，也能在笔记旁问 AI。">
  <meta property="og:type" content="website">
  <title>知流 NoteFlow｜个人知识库</title>
  <link rel="icon" href="./assets/zhiliu.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body id="top">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#top" aria-label="知流 NoteFlow 首页">知流<span>.</span></a>
      <nav aria-label="主导航">
        <a href="#workspace">工作台</a>
        <a href="#search">搜索</a>
        <a href="#assistant">AI 助手</a>
      </nav>
      <a class="repository" href="https://github.com/zczshahaha-del/NoteFlow">GitHub</a>
    </div>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <div class="shell">
        <div class="hero-copy">
          <h1 id="hero-title">写下笔记。<span>需要时，找得回来。</span></h1>
          <p>知流 NoteFlow 是你的个人知识库。写笔记、搜正文，也能在笔记旁问 AI。</p>
          <a class="button" href="#workspace">看工作台</a>
        </div>
        <figure class="hero-figure" id="workspace">
          <a class="hero-screen screen" href="./assets/workspace.webp" aria-label="打开知流桌面工作台截图原图">
            <img src="./assets/workspace.webp" alt="知流桌面工作台。左侧是后端学习等文件夹，右侧打开了 Docker 入门笔记，正文中有命令代码块。" width="1920" height="1133" fetchpriority="high">
          </a>
          <a class="phone screen" href="./assets/mobile.webp" aria-label="打开知流手机工作台截图原图">
            <img src="./assets/mobile.webp" alt="知流手机工作台打开同一篇 Docker 入门笔记。" width="640" height="1385">
          </a>
          <figcaption>知流工作台 · 实际界面截图</figcaption>
        </figure>
      </div>
    </section>

    <section class="feature search-feature" id="search" aria-labelledby="search-title">
      <div class="shell feature-inner">
        <div class="feature-copy">
          <h2 id="search-title">记得一个词，<br>就能搜到。</h2>
          <p>在「搜索全部笔记」里输入「容器」，就能看到标题或正文中的匹配片段。点开结果，接着读。</p>
        </div>
        <figure class="feature-figure">
          <a class="screen" href="./assets/search.webp" aria-label="放大知流搜索界面截图">
            <img src="./assets/search.webp" alt="知流的搜索窗口。输入“容器”后，列表显示相关笔记和匹配片段。" width="1328" height="1024" loading="lazy">
          </a>
          <figcaption>搜索全部笔记</figcaption>
        </figure>
      </div>
    </section>

    <section class="feature assistant-feature" id="assistant" aria-labelledby="assistant-title">
      <div class="shell">
        <div class="assistant-copy">
          <h2 id="assistant-title">有疑问，就在笔记旁问。</h2>
          <p>在 AI 助手里引用当前笔记，继续问「镜像和容器有什么区别？」。回答下方列出出处，点击即可回到原文。</p>
        </div>
        <figure class="assistant-figure">
          <a class="screen" href="./assets/assistant.webp" aria-label="打开知流 AI 助手截图原图">
            <picture>
              <source media="(max-width: 43rem)" srcset="./assets/assistant-detail.webp" width="800" height="648">
              <img src="./assets/assistant.webp" alt="知流 AI 助手回答 Docker 镜像与容器的区别，回答下方列出两处笔记原文。" width="1920" height="1133" loading="lazy">
            </picture>
          </a>
          <figcaption>AI 助手 · 回答及原文引用</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <a class="brand" href="#top" aria-label="知流 NoteFlow 首页">知流<span>.</span></a>
      <p>截图使用测试知识库中的 Docker 示例笔记。</p>
      <nav aria-label="相关链接">
        <a href="https://github.com/zczshahaha-del/NoteFlow">项目仓库</a>
        <a href="https://chengspace.cn/">张成的个人空间</a>
      </nav>
    </div>
  </footer>
</body>
</html>
